# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }}${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HTTPX_REQUIREMENT: ${{ matrix.httpx }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        httpx: ["httpx>=0.27,<1"]
        include:
          - os: windows-latest
            python-version: "3.14"
            httpx: "httpx>=0.27,<1"
            label: ", Windows"
          - os: macos-latest
            python-version: "3.14"
            httpx: "httpx>=0.27,<1"
            label: ", macOS"
          - os: ubuntu-latest
            python-version: "3.10"
            httpx: "httpx==0.27.0"
            label: ", HTTPX minimum"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install the selected runtime dependency set
        shell: python
        run: |
          import os
          import subprocess
          import sys
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "-e", ".[dev]", os.environ["HTTPX_REQUIREMENT"]],
              check=True,
          )
      - run: python -m pip check
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest --cov=samsarix_notifications --cov-report=term-missing
      - run: python examples/local_webhook.py
      - run: python examples/durable_outbox.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel tests and consumer journeys
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          wheel, = (workspace / "dist").glob("*.whl")
          with TemporaryDirectory(prefix="wheel-smoke-", dir=os.environ["RUNNER_TEMP"]) as directory:
              root = Path(directory)
              environment = root / "venv"
              subprocess.run([sys.executable, "-m", "venv", str(environment)], check=True)
              executable = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")

              def run(*args):
                  subprocess.run([str(executable), *map(str, args)], cwd=root, check=True)

              run("-m", "pip", "install", wheel, os.environ["HTTPX_REQUIREMENT"],
                  "pytest>=8.3,<10", "pytest-asyncio>=0.24,<2")
              run("-m", "pip", "check")
              run("-I", "-c", "from pathlib import Path; import sys; import httpx; "
                  "import samsarix_notifications as s; "
                  "assert Path(s.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); "
                  "assert s.__version__ == '0.1.0'; "
                  "print('wheel:', s.__file__, 'HTTPX:', httpx.__version__)")
              run("-I", "-m", "pytest", workspace / "tests", "--import-mode=importlib")
              run("-I", workspace / "examples/local_webhook.py")
              run("-I", workspace / "examples/durable_outbox.py")
