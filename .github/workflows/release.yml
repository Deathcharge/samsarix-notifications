# SPDX-License-Identifier: MPL-2.0
name: Release validation and publishing

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          expected="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "$expected"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest --cov=samsarix_notifications --cov-report=term-missing
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Test downloaded release artifacts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Deliberately no checkout: tests and examples must come from the sdist,
      # and package imports must resolve to the installed wheel.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
          digest-mismatch: error
      - name: Validate wheel installation, sdist tests, and consumer journeys
        shell: bash
        run: |
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          sha256sum "${wheels[0]}" "${sdists[0]}" | tee -a "$GITHUB_STEP_SUMMARY"
          python -m venv "$RUNNER_TEMP/release-wheel"
          candidate_python="$RUNNER_TEMP/release-wheel/bin/python"
          "$candidate_python" -m pip install "${wheels[0]}" 'pytest>=8.3,<10' 'pytest-asyncio>=0.24,<2'
          python -m tarfile --filter data -e "${sdists[0]}" "$RUNNER_TEMP/release-source"
          cd "$RUNNER_TEMP"
          "$candidate_python" -I -c 'import pathlib, sys; from importlib.metadata import version; import samsarix_notifications as s; assert pathlib.Path(s.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()); assert s.__version__ == version("samsarix-notifications"); print(s.__file__)'
          version=$("$candidate_python" -I -c 'from importlib.metadata import version; print(version("samsarix-notifications"))')
          source_dir="$RUNNER_TEMP/release-source/samsarix_notifications-$version"
          "$candidate_python" -I -m pytest "$source_dir/tests" --import-mode=importlib
          "$candidate_python" -I "$source_dir/examples/local_webhook.py"
          "$candidate_python" -I "$source_dir/examples/durable_outbox.py"

  publish:
    name: Publish signed distributions
    # PRs and manual candidate checks must never request publication approval
    # or an OIDC token. Only an explicitly published GitHub Release can publish.
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/samsarix-notifications
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
          digest-mismatch: error
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
